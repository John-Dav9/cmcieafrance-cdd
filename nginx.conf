server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self \"https://meet.cmciea-france.com\"), microphone=(self \"https://meet.cmciea-france.com\"), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://meet.cmciea-france.com; connect-src 'self' https://api.cmciea-france.com wss://api.cmciea-france.com https://meet.cmciea-france.com wss://meet.cmciea-france.com; frame-src 'self' https://meet.cmciea-france.com https://www.youtube.com https://player.vimeo.com; worker-src 'self' blob:; manifest-src 'self'" always;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache assets statiques
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA : toutes les routes vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
