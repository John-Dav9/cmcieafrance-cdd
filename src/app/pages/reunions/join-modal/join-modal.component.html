<div class="modal-backdrop" (click)="close.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">

    <button class="modal-close" (click)="close.emit()" aria-label="Fermer">✕</button>

    <!-- ── Étape 1 : Email ──────────────────────────────── -->
    <ng-container *ngIf="step === 'email'">
      <div class="modal-icon">✝</div>
      <h2 class="modal-title">Rejoindre la réunion</h2>
      <p class="modal-subtitle">Entrez votre adresse email pour accéder</p>

      <form (ngSubmit)="submitEmail()" class="modal-form">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="votre@email.com"
          class="modal-input modal-input--large"
          autocomplete="email"
          autofocus
          required
        />
        <div class="error-msg" *ngIf="error">{{ error }}</div>
        <button type="submit" class="btn-join-modal" [disabled]="loading || !email.trim()">
          <span *ngIf="!loading">Continuer →</span>
          <span *ngIf="loading">
            <span class="btn-spinner"></span> Vérification...
          </span>
        </button>
      </form>
    </ng-container>

    <!-- ── Étape 2 : Formulaire (nouveau membre) ─────────── -->
    <ng-container *ngIf="step === 'register'">
      <button class="modal-back" (click)="back()">← Retour</button>
      <div class="modal-icon">👋</div>
      <h2 class="modal-title">Bienvenue !</h2>
      <p class="modal-subtitle">
        Complétez votre profil pour rejoindre la réunion
      </p>

      <form (ngSubmit)="submitRegister()" class="modal-form">
        <div class="modal-row">
          <input
            type="text"
            [(ngModel)]="form.firstName"
            name="firstName"
            placeholder="Prénom *"
            class="modal-input"
            autofocus
            required
          />
          <input
            type="text"
            [(ngModel)]="form.lastName"
            name="lastName"
            placeholder="Nom *"
            class="modal-input"
            required
          />
        </div>

        <input
          type="tel"
          [(ngModel)]="form.phone"
          name="phone"
          placeholder="Téléphone *"
          class="modal-input"
          required
        />

        <input
          type="text"
          [(ngModel)]="form.city"
          name="city"
          placeholder="Ville (optionnel)"
          class="modal-input"
        />

        <div class="error-msg" *ngIf="error">{{ error }}</div>

        <button
          type="submit"
          class="btn-join-modal"
          [disabled]="loading || !form.firstName.trim() || !form.lastName.trim() || !form.phone.trim()"
        >
          <span *ngIf="!loading">Rejoindre la réunion →</span>
          <span *ngIf="loading">
            <span class="btn-spinner"></span> Inscription...
          </span>
        </button>

        <p class="modal-notice">
          Vos informations sont uniquement utilisées pour cette communauté.
        </p>
      </form>
    </ng-container>

  </div>
</div>
