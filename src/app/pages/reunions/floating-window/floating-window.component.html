<div class="float-window">
  <div class="float-main">
    <div class="float-identity">
      <span [class]="qualityDotClass"></span>
      <span class="float-title">{{ title }}</span>
    </div>

    <button class="float-expand-btn" (click)="expand.emit()" title="Revenir à la salle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <polyline points="15 3 21 3 21 9"/>
        <polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/>
        <line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
      Agrandir
    </button>
  </div>

  <div class="float-controls">
    <button class="float-btn" [class.float-btn--off]="!micOn" (click)="clickToggleMic()" title="Activer ou couper le micro">
      <svg *ngIf="micOn" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg>
      <svg *ngIf="!micOn" viewBox="0 0 24 24"><path d="m3 3 18 18M9 9v2a3 3 0 0 0 5.1 2.1M15 9V5a3 3 0 0 0-5.8-1M17 16.8A7 7 0 0 0 19 10M5 10a7 7 0 0 0 10 6.3M12 17v4M8 21h8"/></svg>
      <span>{{ micOn ? 'Micro' : 'Muet' }}</span>
    </button>
    <button class="float-btn" [class.float-btn--off]="!camOn" (click)="clickToggleCam()" title="Activer ou couper la caméra">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>
      <span>{{ camOn ? 'Caméra' : 'Coupée' }}</span>
    </button>
    <button class="float-btn float-btn--leave" (click)="leave.emit()" title="Quitter la réunion">
      <svg viewBox="0 0 24 24"><path d="M4 14c5-4 11-4 16 0l-3 4-3-2v-3a12 12 0 0 0-4 0v3l-3 2z"/></svg>
      <span>Quitter</span>
    </button>
  </div>
</div>
