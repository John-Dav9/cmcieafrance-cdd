<section>
  <h1>{{ histoireTitle }}</h1>
  <p>{{ histoireContent }}</p>
</section>

<section>
  <h2>{{ visionTitle }}</h2>
  <p>{{ visionContent }}</p>
</section>

<section *ngIf="data?.valeurs?.length">
  <h2>Valeurs</h2>
  <ul>
    <li *ngFor="let valeur of data.valeurs">
      <h3>{{ valeur.title }}</h3>
      <p>{{ valeur.description }}</p>
    </li>
  </ul>
</section>
