<section class="cl-header">
  <h1>{{ pageTitle }}</h1>
  <p *ngIf="pageIntro">{{ pageIntro }}</p>
</section>

<section class="cl-infos" *ngIf="adresse || horaires">
  <div *ngIf="adresse">
    <h2>Adresse</h2>
    <p>{{ adresse }}</p>
  </div>
  <div *ngIf="horaires">
    <h2>Horaires</h2>
    <p style="white-space:pre-line">{{ horaires }}</p>
  </div>
</section>

<section class="cl-membre" *ngIf="membreText">
  <h2>Devenir membre</h2>
  <p>{{ membreText }}</p>
</section>

<section class="cl-contact">
  <h2>{{ contactIntro }}</h2>

  <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
    <div>
      <label>Nom</label>
      <input type="text" name="name" [(ngModel)]="contact.name" required />
    </div>
    <div>
      <label>Email</label>
      <input type="email" name="email" [(ngModel)]="contact.email" required />
    </div>
    <div>
      <label>Message</label>
      <textarea name="message" rows="4" [(ngModel)]="contact.message" required></textarea>
    </div>
    <button type="submit" [disabled]="!contactForm.form.valid">Envoyer</button>
    <p *ngIf="submitted">Merci pour votre message !</p>
    <p *ngIf="error" class="error">{{ error }}</p>
  </form>
</section>
