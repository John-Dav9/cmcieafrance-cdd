<header class="navbar">
  <a routerLink="/" class="logo">
    <img
      src="assets/images/logo-cmciea-france.png"
      alt="CMCIEA France — Chercheurs de Dieu"
    />
    <span class="logo-text">
      COMMUNAUTÉ MISSIONNAIRE<br />
      CHRÉTIENNE INTERNATIONALE<br />
      & ÉGLISES ASSOCIÉES FRANCE
    </span>
  </a>
  <button
    class="nav-toggle"
    type="button"
    aria-label="Ouvrir le menu"
    [attr.aria-expanded]="isMenuOpen"
    aria-controls="nav-menu"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav id="nav-menu" class="navbar-links" [class.open]="isMenuOpen">
    <a routerLink="/premiere-visite" routerLinkActive="active" (click)="closeMenu()">
      Premiere visite
    </a>

    <!-- Ressources dropdown -->
    <div class="nav-dropdown" [class.open]="dropdownOpen === 'ressources'">
      <button class="nav-dropdown-toggle" (click)="toggleDropdown('ressources')">
        Ressources <span class="caret">▾</span>
      </button>
      <div class="nav-dropdown-menu">
        <a routerLink="/ressources/decouvrir" (click)="closeMenu()">Découvrir</a>
        <a routerLink="/bible" (click)="closeMenu()">Bible</a>
        <a routerLink="/cantiques" (click)="closeMenu()">Cantiques</a>
        <a routerLink="/bibliotheque" (click)="closeMenu()">Bibliothèque</a>
        <a routerLink="/messages" (click)="closeMenu()">Messages</a>
        <a routerLink="/replays" (click)="closeMenu()">Replays</a>
      </div>
    </div>

    <a routerLink="/marathon-biblique" routerLinkActive="active" (click)="closeMenu()">
      Marathon Biblique
    </a>

    <a routerLink="/departements" routerLinkActive="active" (click)="closeMenu()">
      Departements
    </a>

    <!-- Communauté dropdown -->
    <div class="nav-dropdown" [class.open]="dropdownOpen === 'communaute'">
      <button class="nav-dropdown-toggle" (click)="toggleDropdown('communaute')">
        Communauté <span class="caret">▾</span>
      </button>
      <div class="nav-dropdown-menu">
        <a routerLink="/groupes-de-cellule" (click)="closeMenu()">Groupes de cellule</a>
        <a routerLink="/temoignages" (click)="closeMenu()">Témoignages</a>
        <a routerLink="/annonces" (click)="closeMenu()">Annonces</a>
        <a routerLink="/prieres" (click)="closeMenu()">Demandes de prière</a>
      </div>
    </div>

    <a routerLink="/reunions" routerLinkActive="active" class="reunions-link" (click)="closeMenu()">
      📹 RÉUNIONS
    </a>
    <a routerLink="/actualites" routerLinkActive="active" class="actualites" (click)="closeMenu()">
      🔔 ACTUALITES
    </a>
    <a routerLink="/mon-espace" routerLinkActive="active" class="mon-espace" (click)="closeMenu()">
      👤 Mon Espace
    </a>
  </nav>
</header>
