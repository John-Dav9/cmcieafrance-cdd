<header class="navbar">
  <a routerLink="/" class="logo">
    <img
      src="assets/images/logo-cmciea-france.png"
      alt="CMCIEA France — Chercheurs de Dieu"
    />
    <span class="logo-text">
      COMMUNAUTÉ MISSIONNAIRE<br />
      CHRÉTIENNE INTERNATIONALE<br />
      & ÉGLISES ASSOCIÉES FRANCE
    </span>
  </a>
  <button
    class="nav-toggle"
    type="button"
    aria-label="Ouvrir le menu"
    [attr.aria-expanded]="isMenuOpen"
    aria-controls="nav-menu"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav id="nav-menu" class="navbar-links" [class.open]="isMenuOpen">
    <a
      routerLink="/premiere-visite"
      routerLinkActive="active"
      aria-label="Premiere visite"
      (click)="closeMenu()"
    >
      Premiere visite
    </a>
    <a
      routerLink="/ressources/decouvrir"
      routerLinkActive="active"
      aria-label="Ressources"
      (click)="closeMenu()"
    >
      Ressources
    </a>
    <a
      routerLink="/marathon-biblique"
      routerLinkActive="active"
      aria-label="Programmmes"
      (click)="closeMenu()"
    >
      Marathon Biblique
    </a>
    <a
      routerLink="/ministere-enfants"
      routerLinkActive="active"
      aria-label="Departement"
      (click)="closeMenu()"
    >
      Departement
    </a>
    <!-- ? BOUTON ACTUALITES -->
    <a
      routerLink="/actualites"
      routerLinkActive="active"
      class="actualites"
      aria-label="Actualites de CMCIEA France"
      (click)="closeMenu()"
    >
      🔔 ACTUALITES
    </a>
  </nav>
</header>
