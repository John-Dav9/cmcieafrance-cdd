<ng-container *ngIf="isActive">

  <!-- ══ INTERFACE COMPLÈTE (page /reunions/salle) ══════════ -->
  <!-- Le container Jitsi vit ICI, persistant dans AppComponent -->
  <div class="jitsi-host"
       #jitsiHost
       [class.jitsi-fullscreen]="!isFloating"
       [class.jitsi-pip]="isFloating">
  </div>

  <!-- ══ MINI-LECTEUR FLOTTANT ═════════════════════════════ -->
  <div class="pip-window" *ngIf="isFloating" cdkDrag>

    <div class="pip-topbar">
      <span class="pip-title">{{ title }}</span>
      <span class="pip-timer">{{ timer }}</span>
      <div class="pip-net" [ngClass]="quality">
        <span class="pip-dot"></span>
      </div>
    </div>

    <div class="pip-controls">
      <button class="pip-btn" (click)="toggleMic()" title="Micro">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>

      <button class="pip-btn" (click)="toggleCam()" title="Caméra">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
      </button>

      <button class="pip-btn pip-btn--expand" (click)="expand()" title="Agrandir">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 3 21 3 21 9"/>
          <polyline points="9 21 3 21 3 15"/>
          <line x1="21" y1="3" x2="14" y2="10"/>
          <line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
      </button>

      <button class="pip-btn pip-btn--leave" (click)="leave()" title="Quitter">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07C9.44 17.29 7.76 15.66 6.5 13.77"/>
          <path d="M6.5 13.77A19.79 19.79 0 0 1 3.43 5.14 2 2 0 0 1 5.41 3h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L9.39 10.9"/>
          <line x1="23" y1="1" x2="1" y2="23" stroke="#ef4444"/>
        </svg>
      </button>
    </div>

  </div>

</ng-container>
